# Publishes the app to GitHub Pages (small: ~2 MB).
# The big offline files (thailand.pmtiles, elevation.pmtiles) are built and served by the
# separate repo Spidersqdn/DataBase at https://spidersqdn.github.io/DataBase/AirNavFlow/
# File name kept: notam-import.yml starts this workflow by name.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore: ["notam/inbox/**"] # handled by notam-import.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          timeout: 1800000   # 30 min: large map files can take >10 min to sync to Pages
