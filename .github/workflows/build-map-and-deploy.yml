# Publishes the app to GitHub Pages (small: ~2 MB).
# The big offline files (thailand.pmtiles, elevation.pmtiles) are built and served by the
# separate repo Spidersqdn/DataBase at https://spidersqdn.github.io/DataBase/
# File name kept: notam-import.yml starts this workflow by name.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore: ["notam/inbox/**"] # handled by notam-import.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 min: large map files can take >10 min to sync to Pages
